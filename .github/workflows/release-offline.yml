name: Build & Publish Native Installers (.exe, .apk) & Offline Bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis GitHub (contoh: v0.9.1)"
        required: false
        default: "v0.9.1"

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Windows Installer (.exe via Tauri v2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typecheck
      - name: Build Tauri NSIS installer (.exe)
        run: npx tauri build
      - name: Normalize Windows installer filename
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "NSIS .exe installer tidak ditemukan" }
          Copy-Item $exe.FullName -Destination "release-artifacts/OpenFormu-Windows-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release-artifacts/OpenFormu-Windows-x64-setup.exe

  build-android-apk:
    name: Build Android APK (via Capacitor 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platform-tools build-tools;36.0.0"
      - run: npm ci
      - name: Build offline bundle for Capacitor WebView
        run: npm run build:native
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Build Android APK (debug-signed, installable offline)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Normalize Android APK filename
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/OpenFormu-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-artifacts/OpenFormu-Android.apk

  build-portable-zip:
    name: Build Portable Offline Bundle (.zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Build standalone offline bundle
        env:
          VITE_BASE_PATH: /
        run: npm run build
      - name: Package portable offline launcher
        run: |
          mkdir -p release-bundle/dist
          cp -r dist/* release-bundle/dist/
          cat << 'EOF' > release-bundle/server.mjs
          import http from "node:http";
          import fs from "node:fs";
          import path from "node:path";
          import { fileURLToPath } from "node:url";

          const __dirname = path.dirname(fileURLToPath(import.meta.url));
          const distDir = path.join(__dirname, "dist");
          const port = Number(process.env.PORT || 4173);

          const MIME = {
            ".html": "text/html; charset=utf-8",
            ".js": "application/javascript; charset=utf-8",
            ".css": "text/css; charset=utf-8",
            ".json": "application/json; charset=utf-8",
            ".webmanifest": "application/manifest+json; charset=utf-8",
            ".wasm": "application/wasm",
            ".png": "image/png",
            ".svg": "image/svg+xml",
            ".ico": "image/x-icon",
            ".woff2": "font/woff2",
          };

          const server = http.createServer((req, res) => {
            const urlPath = (req.url || "/").split("?")[0];
            const safeRel = path.normalize(urlPath === "/" ? "index.html" : urlPath).replace(/^(\.\.[/\\])+/, "");
            let filePath = path.join(distDir, safeRel);
            if (!fs.existsSync(filePath) || fs.statSync(filePath).isDirectory()) {
              filePath = path.join(distDir, "index.html");
            }
            const ext = path.extname(filePath).toLowerCase();
            res.writeHead(200, { "Content-Type": MIME[ext] || "application/octet-stream" });
            fs.createReadStream(filePath).pipe(res);
          });

          server.listen(port, "127.0.0.1", () => {
            console.log(`OpenFormu offline siap di http://127.0.0.1:${port}`);
          });
          EOF
          cat << 'EOF' > release-bundle/start-windows.bat
          @echo off
          echo Menjalankan OpenFormu Offline di http://127.0.0.1:4173 ...
          start "" http://127.0.0.1:4173
          node "%~dp0server.mjs"
          EOF
          cat << 'EOF' > release-bundle/start-mac-linux.sh
          #!/usr/bin/env bash
          cd "$(dirname "$0")"
          echo "Menjalankan OpenFormu Offline di http://127.0.0.1:4173 ..."
          (sleep 1 && (xdg-open http://127.0.0.1:4173 || open http://127.0.0.1:4173) 2>/dev/null) &
          node server.mjs
          EOF
          chmod +x release-bundle/start-mac-linux.sh
          mkdir -p release-artifacts
          (cd release-bundle && zip -r ../release-artifacts/openformu-offline-portable.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: portable-zip
          path: release-artifacts/openformu-offline-portable.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows-exe, build-android-apk, build-portable-zip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Attach .exe, .apk, and .zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            release-assets/OpenFormu-Windows-x64-setup.exe
            release-assets/OpenFormu-Android.apk
            release-assets/openformu-offline-portable.zip
          generate_release_notes: true
