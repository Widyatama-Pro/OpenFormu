<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F4EF" />
    <meta
      name="description"
      content="OpenFormu: aplikasi formulasi pakan ternak presisi offline-first berbasis optimasi Linear Programming."
    />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <title>OpenFormu</title>
    <script>
      (function () {
        try {
          var validPalettes = [
            "original-default",
            "template-01",
            "template-03",
            "template-04",
            "template-05",
          ];
          var palette =
            localStorage.getItem("openformu-theme-id") ||
            localStorage.getItem("openformul-theme-id") ||
            localStorage.getItem("app-theme-id") ||
            "original-default";
          if (validPalettes.indexOf(palette) === -1) {
            palette = "original-default";
          }
          var modeSetting =
            localStorage.getItem("openformu-theme-mode") ||
            localStorage.getItem("openformul-theme-mode") ||
            localStorage.getItem("app-theme-mode") ||
            "light";
          var prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolvedMode =
            modeSetting === "dark" || (modeSetting === "system" && prefersDark) ? "dark" : "light";
          var amoled =
            (localStorage.getItem("openformu-theme-amoled") ||
              localStorage.getItem("openformul-theme-amoled") ||
              localStorage.getItem("app-theme-amoled")) === "true";
          var validUiModes = ["biasa", "enhanced", "anti-slop"];
          var uiMode =
            localStorage.getItem("openformu-ui-mode") || localStorage.getItem("openformul-ui-mode");
          if (validUiModes.indexOf(uiMode) === -1) {
            var legacyEnhancer =
              localStorage.getItem("openformu-theme-enhancer") ||
              localStorage.getItem("openformul-theme-enhancer");
            uiMode = legacyEnhancer === "false" ? "biasa" : "enhanced";
          }

          var root = document.documentElement;
          root.setAttribute("data-theme", palette);
          root.setAttribute("data-mode", resolvedMode);
          root.setAttribute("data-ui-mode", uiMode);
          root.setAttribute("data-ui-enhancer", uiMode === "enhanced" ? "true" : "false");
          if (resolvedMode === "dark") {
            root.classList.add("dark");
            if (amoled) {
              root.setAttribute("data-amoled", "true");
            }
          } else {
            root.classList.remove("dark");
            root.removeAttribute("data-amoled");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
