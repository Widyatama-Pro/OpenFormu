<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141B26" />
    <meta
      name="description"
      content="OpenFormu: aplikasi formulasi pakan ternak presisi offline-first berbasis optimasi Linear Programming."
    />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <title>OpenFormu</title>
    <script>
      (function () {
        try {
          var cap = window.Capacitor;
          var capPlatform = cap && typeof cap.getPlatform === "function" ? cap.getPlatform() : "";
          var isAndroid =
            capPlatform === "android" ||
            (capPlatform !== "ios" &&
              ((cap && typeof cap.isNativePlatform === "function" && cap.isNativePlatform()) ||
                Boolean(window.OpenFormulSystemBars) ||
                (window.navigator && /\bAndroid\b/i.test(window.navigator.userAgent || "")) ||
                (typeof navigator !== "undefined" &&
                  /\bAndroid\b/i.test(navigator.userAgent || ""))));
          var validPalettes = [
            "template-04",
            "original-default",
            "template-01",
            "template-03",
            "template-05",
          ];
          var palette =
            localStorage.getItem("openformu-theme-id") ||
            localStorage.getItem("openformul-theme-id") ||
            localStorage.getItem("app-theme-id") ||
            "template-04";
          if (validPalettes.indexOf(palette) === -1) {
            palette = "template-04";
          }
          var modeSetting =
            localStorage.getItem("openformu-theme-mode") ||
            localStorage.getItem("openformul-theme-mode") ||
            localStorage.getItem("app-theme-mode") ||
            (isAndroid ? "light" : "dark");
          var prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolvedMode =
            modeSetting === "dark" || (modeSetting === "system" && prefersDark) ? "dark" : "light";
          var amoled =
            (localStorage.getItem("openformu-theme-amoled") ||
              localStorage.getItem("openformul-theme-amoled") ||
              localStorage.getItem("app-theme-amoled")) === "true";
          var validUiModes = ["biasa", "enhanced", "anti-slop"];
          var uiMode =
            localStorage.getItem("openformu-ui-mode") || localStorage.getItem("openformul-ui-mode");
          if (validUiModes.indexOf(uiMode) === -1) {
            var legacyEnhancer =
              localStorage.getItem("openformu-theme-enhancer") ||
              localStorage.getItem("openformul-theme-enhancer");
            uiMode = legacyEnhancer === "false" ? "biasa" : "enhanced";
          }
          var engineMode =
            localStorage.getItem("openformu-engine-mode") ||
            localStorage.getItem("openformul-engine-mode") ||
            (isAndroid ? "crisp" : "ultra");
          var motionEngine =
            localStorage.getItem("openformu-motion-engine") ||
            localStorage.getItem("openformul-motion-engine") ||
            (isAndroid ? "css_native" : "gpu_flip");

          var root = document.documentElement;
          root.setAttribute("data-theme", palette);
          root.setAttribute("data-mode", resolvedMode);
          root.setAttribute("data-ui-mode", uiMode);
          root.setAttribute("data-ui-enhancer", uiMode === "enhanced" ? "true" : "false");
          root.setAttribute("data-engine-mode", engineMode);
          root.setAttribute("data-motion-engine", motionEngine);
          if (resolvedMode === "dark") {
            root.classList.add("dark");
            if (amoled) {
              root.setAttribute("data-amoled", "true");
            }
          } else {
            root.classList.remove("dark");
            root.removeAttribute("data-amoled");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
